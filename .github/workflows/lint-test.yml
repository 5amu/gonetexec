name: 🤞🏼 Lint Test

on:
  push:
    branches: [ "main" ]
    paths:
      - '**.go'
      - '**.mod'
  pull_request:
    paths:
      - '**.go'
      - '**.mod'
  workflow_dispatch:

jobs:
  lint:
    name: Lint Test
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          # Pin to the go.mod toolchain. golangci-lint v2.5.0 ships a go1.25
          # typechecker and panics on a newer stdlib (e.g. the 'stable' runner
          # Go), so the linter's Go must not exceed its build version.
          go-version: '1.24.13'

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.5.0
          args: --timeout 5m